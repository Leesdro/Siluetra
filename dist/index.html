<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f6f2"><meta name="description" content="Siluetra: bocetos de indumentaria con edición vectorial, costuras y recursos de construcción."><title>Siluetra — Editor de prendas</title><link rel="stylesheet" href="vendor/spectrum-tokens.css"><link rel="stylesheet" href="vendor/dockview.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="desktop.css"></head><body><sp-theme id="siluetra-theme" system="spectrum" color="light" scale="medium" class="spectrum spectrum--light spectrum--medium">
<div id="start" class="start"><header class="start-head"><div class="brand"><span class="brand-mark" data-brand-mark></span>Siluetra</div><span class="version">EDITOR DE INDUMENTARIA · 2D VECTORIAL</span></header><div class="launcher-layout"><nav class="launcher-nav" aria-label="Inicio"><button class="active" data-icon="folder" data-label="Recientes">Recientes</button><button id="new-document-nav" data-icon="plus" data-label="Nuevo">Nuevo</button><button id="open-native-nav" data-icon="folder" data-label="Abrir proyecto">Abrir proyecto</button><span class="launcher-storage">Guardado local</span></nav><main class="start-main"><div class="launcher-actions"><button id="new-document" class="primary" data-icon="plus" data-label="Nuevo">Nuevo</button><button id="open-native" class="secondary" data-icon="folder" data-label="Abrir proyecto">Abrir proyecto</button></div><div class="recent-top"><h1>Trabajos recientes</h1><div class="recent-view"><button id="recent-grid" class="active" data-icon="grid" aria-label="Vista de cuadrícula" title="Cuadrícula"></button><button id="recent-list" data-icon="group" aria-label="Vista de lista" title="Lista"></button></div></div><div id="recents" class="recents"></div><div class="start-note">Proyectos guardados en este navegador · Formato compatible .garment.json</div></main></div></div>
<div id="editor" class="editor hidden"><header class="topbar"><button id="home" class="brand compact" title="Proyectos"><span class="brand-mark" data-brand-mark></span> Siluetra</button><span class="divider"></span><div class="document-area"><div class="document-title"><input id="project-name" aria-label="Nombre del proyecto"><button id="variant-button" title="Variantes" aria-expanded="false">V1</button></div><span id="save-state" class="save-state">Guardado</span></div><div class="document-view"><div class="view-tabs"><button data-view="front" class="active">Frente</button><button data-view="back">Espalda</button></div><button id="structure-state" class="structure-state" title="Relación entre frente y espalda">Vinculada</button></div><nav id="ux-menus" class="ux-menus" aria-label="Menús de edición"></nav><div class="top-actions"><div class="app-action-group"><button id="undo" class="icon-button" data-icon="undo" aria-label="Deshacer" title="Deshacer · Ctrl Z"></button><button id="redo" class="icon-button" data-icon="redo" aria-label="Rehacer" title="Rehacer · Ctrl Shift Z"></button><button id="history-button" class="icon-button" data-icon="history" title="Historial" aria-label="Historial" aria-expanded="false"></button></div><div class="app-action-group"><button id="quick-theme" class="icon-button" data-icon="sun" title="Apariencia" aria-label="Apariencia" aria-haspopup="menu" aria-expanded="false"></button><details class="workspace-menu"><summary>Ventana</summary><div><button data-workspace-show="library">Mostrar Capas</button><button data-workspace-show="resources">Mostrar Recursos</button><button data-workspace-show="appearance">Mostrar Apariencia</button><button data-workspace-show="inspector">Mostrar Inspector</button><button data-workspace-show="history">Mostrar Historial</button><button data-workspace-show="color">Mostrar Color</button><button data-workspace-show="construction">Mostrar Construcción</button><button data-workspace-show="fabric">Mostrar Textura de tela</button><button data-workspace-reset>Restablecer espacio de trabajo</button><button data-toolbar-side>Barra de herramientas: cambiar lado</button></div></details><button id="settings" class="icon-button" data-icon="settings" title="Ajustes" aria-label="Ajustes"></button><button id="help" class="icon-button" data-icon="help" title="Ayuda" aria-label="Ayuda"></button></div><div class="app-action-group"><button id="save" data-icon="save" data-label="Guardar">Guardar</button><button id="export" class="primary" data-icon="export" data-label="Exportar">Exportar</button></div></div></header>
<div id="context-bar" class="context-bar"></div><div class="workspace"><nav id="tools" class="tools"></nav><aside id="library-panel" class="library"><div class="dock-header"><strong>Biblioteca</strong><span>Recursos de prenda</span></div><div id="library-content"></div></aside><aside id="resources-panel" class="library"><div id="resources-content"></div></aside><aside id="appearance-panel" class="properties"><div id="appearance-content"></div></aside><main id="canvas-wrap" class="canvas-wrap"><div class="canvas-label"><span id="canvas-title">HOODIE / FRENTE</span><span id="canvas-dimensions">700 × 700</span></div><svg id="canvas" xmlns="http://www.w3.org/2000/svg" tabindex="0" aria-label="Lienzo vectorial"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="0" cy="0" r=".7" fill="#cdd2ce"/></pattern></defs><g id="camera"><rect class="artboard" width="700" height="700" fill="white"/><rect id="gridrect" width="700" height="700" fill="url(#grid)" pointer-events="none"/><g id="art"></g><g id="guides" pointer-events="none"></g><g id="axis" pointer-events="none"></g><g id="selection"></g><g id="draft" pointer-events="none"></g><g id="tool-feedback" pointer-events="none"></g></g></svg></main><aside id="inspector-panel" class="properties"><div class="dock-header"><strong>Inspector</strong><span>Propiedades</span></div><div id="properties"></div></aside></div><footer class="statusbar"><span class="status-hint"><span id="hint">Seleccioná una pieza para empezar</span></span><span id="object-count"></span><div class="canvas-bottom"><button id="live-mirror" data-learn="liveMirror" data-icon="liveMirror" data-label="Espejo vivo" aria-label="Espejo vivo"></button><button id="axis-toggle" data-icon="axis" data-label="Eje" title="Mostrar eje central"></button><button id="snap" class="active" data-icon="snap" data-label="Imán" title="Activar imán"></button><button id="grid-toggle" data-icon="grid" data-label="Grilla" title="Mostrar grilla"></button><span class="divider"></span><div class="zoom-group"><button id="zoom-out" data-icon="minus" aria-label="Alejar" title="Alejar"></button><button id="zoom" title="Editar porcentaje de zoom">100%</button><input id="zoom-edit" class="zoom-edit hidden" type="number" min="8" max="1200" step="1" aria-label="Porcentaje de zoom"><button id="zoom-in" data-icon="plus" aria-label="Acercar" title="Acercar"></button><button id="fit" data-icon="fit" title="Ajustar al lienzo" aria-label="Ajustar al lienzo"></button></div></div><span id="status" aria-live="polite">Listo</span></footer></div>
<div id="templates" hidden></div><div id="project-menu" class="context hidden" role="menu" aria-label="Opciones de proyecto"></div><div id="tool-learning-card" class="tool-learning-card hidden" role="tooltip" aria-hidden="true"></div><div id="appearance-popover" class="appearance-popover hidden" role="menu" aria-label="Apariencia"></div><section id="construction-palette" class="floating-palette hidden" role="dialog" aria-label="Construcción"></section><sp-popover id="color-palette" class="floating-palette color-palette hidden" role="dialog" aria-label="Color" open></sp-popover><section id="fabric-palette" class="floating-palette hidden" role="dialog" aria-label="Textura de tela"></section><div id="panel-preview" class="edge-confirm hidden"></div><section id="history-palette" class="floating-palette history-palette hidden" role="dialog" aria-label="Historial"></section><div id="variants-popover" class="variants-popover hidden" role="dialog" aria-label="Variantes"></div><div id="edge-confirm" class="edge-confirm hidden"></div><section id="pathfinder-popover" class="pathfinder-popover hidden" aria-label="Pathfinder"></section><div id="context" class="context hidden"></div><dialog id="modal"></dialog><input type="file" id="image-input" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden><input type="file" id="project-input" accept=".json,.garment.json" hidden><div id="toast" role="status"></div><script type="module" src="desktop-entry.js"></script></sp-theme></body></html>
